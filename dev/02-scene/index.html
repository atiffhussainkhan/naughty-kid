<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom scene — Dev 02</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1c1a17; color: #f4efe4; font-family: Georgia, "Times New Roman", serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #status {
      position: fixed; left: 16px; bottom: 16px; margin: 0;
      padding: 8px 12px; background: rgba(20, 16, 12, 0.72); border-radius: 6px;
      font-size: 14px; line-height: 1.4; max-width: 48ch;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <p id="status">Loading classroom…</p>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/room.js"></script>
  <script>
    (function () {
      var LOADER_URL = "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      var UTILS_URL = "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js";
      var status = document.getElementById("status");
      var view = null;

      function importedNames(source) {
        var found = {};
        var match = source.match(/import\s*\{([\s\S]*?)\}\s*from\s*['"]three['"]/);
        var parts;
        var i;
        var piece;
        var bits;
        if (!match) return found;
        parts = match[1].split(",");
        for (i = 0; i < parts.length; i++) {
          piece = parts[i].replace(/\/\*[\s\S]*?\*\//g, "").trim();
          if (!piece) continue;
          bits = piece.split(/\s+as\s+/);
          found[bits[bits.length - 1].trim()] = bits[0].trim();
        }
        return found;
      }

      function bridgeThree(names) {
        var lines = ["const THREE = window.THREE;"];
        var local;
        for (local in names) {
          if (Object.prototype.hasOwnProperty.call(names, local)) {
            lines.push("export const " + local + " = THREE." + names[local] + ";");
          }
        }
        return URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/javascript" }));
      }

      function installLoader() {
        if (!window.THREE) return Promise.reject(new Error("THREE missing"));
        return Promise.all([
          fetch(LOADER_URL).then(function (res) { if (!res.ok) throw new Error("GLTFLoader"); return res.text(); }),
          fetch(UTILS_URL).then(function (res) { if (!res.ok) throw new Error("BufferGeometryUtils"); return res.text(); })
        ]).then(function (files) {
          var names = importedNames(files[0]);
          var utilsNames = importedNames(files[1]);
          var key;
          var threeUrl;
          var utilsUrl;
          var loaderUrl;
          var utilsSource;
          var loaderSource;
          for (key in utilsNames) names[key] = utilsNames[key];
          threeUrl = bridgeThree(names);
          utilsSource = files[1].replace(/from\s*['"]three['"]/, "from " + JSON.stringify(threeUrl));
          utilsUrl = URL.createObjectURL(new Blob([utilsSource], { type: "text/javascript" }));
          loaderSource = files[0]
            .replace(/from\s*['"]three['"]/, "from " + JSON.stringify(threeUrl))
            .replace(/from\s*['"]\.\.\/utils\/BufferGeometryUtils\.js['"]/, "from " + JSON.stringify(utilsUrl));
          loaderUrl = URL.createObjectURL(new Blob([loaderSource], { type: "text/javascript" }));
          return import(loaderUrl).then(function (mod) {
            window.THREE.GLTFLoader = mod.GLTFLoader;
          });
        });
      }

      function frame() {
        if (!view) return;
        view.renderer.render(view.scene, view.camera);
        requestAnimationFrame(frame);
      }

      function boot() {
        var canvas = document.getElementById("view");
        view = CLASSROOM.scene.mount(canvas);
        window.__view = view;
        window.addEventListener("resize", function () { view.resize(); });
        CLASSROOM.room.load(view.scene).then(function (anchors) {
          status.textContent =
            "Classroom shell ready — floor, walls, desk zone, back, whiteboard, lighting. " +
            "Shield −X · cushion +X · camera at back looking front.";
          console.log("room anchors", Object.keys(anchors));
          frame();
        }).catch(function (err) {
          status.textContent = "Scene load failed: " + (err && err.message ? err.message : err);
          console.error(err);
        });
      }

      installLoader().then(boot, function (err) {
        status.textContent = "Loader failed: " + (err && err.message ? err.message : err);
        console.error(err);
      });
    })();
  </script>
</body>
</html>
